[project]
name = "pykorail"
# 버전은 git 태그에서 나옵니다 (hatch-vcs). 여기에 숫자를 적지 마세요 —
# `git tag v0.2.0` 이 곧 0.2.0 릴리스입니다. 두 곳에 적으면 반드시 어긋납니다.
dynamic = ["version"]
description = "코레일(KTX) 스마트 예매 비공식 Python 클라이언트"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "devgyurak", email = "devgyurak@gmail.com" }]
keywords = ["korail", "ktx", "letskorail", "train", "reservation", "korea"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2024.2.2",
    "curl-cffi>=0.7.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
# curl_cffi 를 못 쓰는 환경(주로 Windows 의 libcurl DLL 로드 실패)용 폴백.
# TLS 지문이 달라져 서버가 로그인을 거부할 수 있으므로 최후의 수단입니다.
fallback = ["requests>=2.31.0"]

[project.urls]
Homepage = "https://github.com/devgyurak/pykorail"
Repository = "https://github.com/devgyurak/pykorail"
Issues = "https://github.com/devgyurak/pykorail/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# git 이력이 없는 곳(소스 tarball, 얕은 체크아웃)에서도 빌드가 죽지 않게 합니다.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
# 빌드 시점에 확정된 버전을 파일로 박아, 설치 후 git 없이도 읽을 수 있게 합니다.
version-file = "src/pykorail/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pykorail"]

[tool.hatch.build.targets.sdist]
include = ["src/pykorail", "tests", "README.md", "docs", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a10",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
# 리팩터링 이전 원본. src/pykorail 로 옮겨졌고 대조 검증용으로만 남겨 둡니다.
# hatch-vcs 가 빌드 시 생성하는 파일 — 손으로 고치지 않으므로 검사 대상이 아닙니다.
extend-exclude = [
    "src/pykorail/_version.py",
    # 로컬 실험 스크립트 (gitignore 대상)
    "a.py",
    "scratch*.py",
    "local",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # 한글 주석에 전각 문자가 섞이는 것은 의도된 것입니다.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 테스트의 클래스 속성은 공유 픽스처 데이터라 ClassVar 표기가 소음입니다.
"tests/*" = ["S101", "RUF012"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- ty
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# curl_cffi / requests 는 배포 스텁이 없어 임포트 해석이 실패할 수 있습니다.
unresolved-import = "warn"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# 커버리지 게이트는 CI 가 아니라 로컬 실행에도 걸립니다 — 90% 아래로 내려가면 실패합니다.
addopts = "-q --cov=pykorail --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/pykorail"]
branch = true

[tool.coverage.report]
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
]
