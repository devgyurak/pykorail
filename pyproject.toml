[project]
name = "pykorail"
# 버전은 git 태그에서 나옵니다 (hatch-vcs). 여기에 숫자를 적지 마세요 —
# `git tag v0.2.0` 이 곧 0.2.0 릴리스입니다. 두 곳에 적으면 반드시 어긋납니다.
dynamic = ["version"]
description = "코레일(KTX) 스마트 예매 비공식 Python 클라이언트"
readme = "README.md"
requires-python = ">=3.11"
# MIT 에 상업적 이득 금지 조항을 더한 자체 라이선스라 SPDX 표준 식별자가 없습니다.
# PEP 639 의 LicenseRef- 로 가리키고, 라이선스 classifier 는 식별자와 함께 쓰지 않습니다.
license = "LicenseRef-pykorail"
license-files = ["LICENSE"]
authors = [{ name = "devgyurak", email = "devgyurak@gmail.com" }]
keywords = ["korail", "ktx", "letskorail", "train", "reservation", "korea"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2024.2.2",
    # 하한을 0.10.0 으로 두는 이유: 0.9.x 이하에는 최상위 `curl_cffi.Session` 이
    # 없습니다 (0.10.0 에서 처음 생겼습니다). transport.py 가 그 이름을 직접 쓰므로
    # 하한을 낮추면 `Korail()` 이 `AttributeError` 로 즉시 죽습니다 — 폴백도 안 탑니다
    # (import 자체는 성공하니까요). CI 의 `lowest` 잡이 이 하한을 실제로 검증합니다.
    "curl-cffi>=0.10.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
# curl_cffi 를 못 쓰는 환경(주로 Windows 의 libcurl DLL 로드 실패)용 폴백.
# TLS 지문이 달라져 서버가 로그인을 거부할 수 있으므로 최후의 수단입니다.
fallback = ["requests>=2.31.0"]

[project.urls]
Homepage = "https://github.com/devgyurak/pykorail"
Documentation = "https://pykorail.devgyurak.com"
Repository = "https://github.com/devgyurak/pykorail"
Issues = "https://github.com/devgyurak/pykorail/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# git 이력이 없는 곳(소스 tarball, 얕은 체크아웃)에서도 빌드가 죽지 않게 합니다.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
# 빌드 시점에 확정된 버전을 파일로 박아, 설치 후 git 없이도 읽을 수 있게 합니다.
version-file = "src/pykorail/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pykorail"]

[tool.hatch.build.targets.sdist]
include = ["src/pykorail", "tests", "README.md", "docs", "LICENSE"]

[dependency-groups]
dev = [
    # 워크플로 린터. uvx 로 즉석 실행하지 않고 여기에 잠그는 이유는, CI 의 필수
    # 체크(`ci-ok`)가 이 도구에 걸리기 때문입니다 — 버전을 안 잠그면 서드파티의
    # 새 릴리스가 무관한 PR 을 빨갛게 만듭니다. 잠가 두면 그 변화가 Dependabot
    # PR 로 먼저 오고, 거기서 한 번에 고칩니다.
    "actionlint-py>=1.7.12",
    "pytest>=8.0.0",
    # 비동기 테스트(``async def test_*``)를 그대로 돌리려면 필요합니다. 규약은
    # tests/test_style.py 가 AST 로 강제하므로, 그 검사기가 async 테스트도 보게
    # 되는 순간(``_test_functions``)부터 수집 자체가 실패하지 않도록 함께 들어옵니다.
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a10",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# 리팩터링 이전 원본. src/pykorail 로 옮겨졌고 대조 검증용으로만 남겨 둡니다.
# hatch-vcs 가 빌드 시 생성하는 파일 — 손으로 고치지 않으므로 검사 대상이 아닙니다.
extend-exclude = [
    "src/pykorail/_version.py",
    # 로컬 실험 스크립트 (gitignore 대상)
    "a.py",
    "scratch*.py",
    "local",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # 한글 주석에 전각 문자가 섞이는 것은 의도된 것입니다.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 테스트의 클래스 속성은 공유 픽스처 데이터라 ClassVar 표기가 소음입니다.
"tests/*" = ["S101", "RUF012"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- ty
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# curl_cffi / requests 는 배포 스텁이 없어 임포트 해석이 실패할 수 있습니다.
unresolved-import = "warn"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# 커버리지 게이트는 CI 가 아니라 로컬 실행에도 걸립니다 — 90% 아래로 내려가면 실패합니다.
addopts = "-q --cov=pykorail --cov-report=term-missing --cov-fail-under=90"
# 비동기 테스트에 마커를 붙이지 않아도 수집되게 합니다(``auto``). 명시 마커를
# 빠뜨린 async 테스트가 조용히 **수집되지 않고** 통과한 것처럼 보이는 것을 막습니다.
asyncio_mode = "auto"
# 이벤트 루프는 테스트 함수마다 새로 만듭니다(function). 루프 하나를 공유하면
# 앞 테스트가 남긴 세션·태스크가 뒤 테스트의 실패로 이어져 원인 추적이 어려워집니다.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/pykorail"]
branch = true

[tool.coverage.report]
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
]
