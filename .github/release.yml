# `gh release create --generate-notes` 가 이 설정으로 변경 목록을 분류합니다.
# 라벨이 없는 PR 은 "기타"로 들어가므로, PR 에 라벨만 붙여 두면 릴리스 노트가
# 자동으로 정리됩니다.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
    # dependabot 은 **일부러 빼지 않았습니다.** 저자 제외는 라벨 분류보다 먼저
    # 걸리므로, 여기에 넣으면 아래 📦 의존성 카테고리가 영원히 빕니다.
    # `curl-cffi` 나 `pycryptodome` 범프는 이 패키지를 설치하는 사람에게 실제로
    # 의미 있는 정보입니다 — 릴리스 노트에 실려야 합니다.
    authors:
      - github-actions

  categories:
    - title: 💥 호환성이 깨지는 변경
      labels: [breaking, breaking-change]

    # 아래 순서가 곧 우선순위입니다 — PR 이 여러 카테고리에 걸리면 **먼저 오는 쪽
    # 하나에만** 들어갑니다. 추측이 아니라 확인한 사실입니다: 두 라벨을 붙인 PR 로
    # `gh api repos/OWNER/REPO/releases/generate-notes` 를 찍어 보면 앞 카테고리에만
    # 실립니다 (이 API 는 릴리스를 만들지 않아 안전하게 확인할 수 있습니다).
    #
    # 그래서 security·external-api 를 feature·bug 앞에 둡니다. 순서가 반대면
    # `bug` + `external-api` 를 붙인 PR 이 🐛 에만 들어가고 🚄 는 영원히 비어
    # 있게 됩니다. 부수 효과로 `feature` + `external-api` 인 새 엔드포인트 PR 도
    # ✨ 가 아니라 🚄 로 갑니다 — 의도한 것입니다. 🚄 가 사용자에게 가장 중요한
    # 축이라서요.
    - title: 🔐 보안
      labels: [security]

    - title: 🚄 코레일 API 대응
      # 외부 API 변화 추종(엔드포인트·폼 필드·서명). 사용자에게 가장 중요한 축입니다.
      labels: [external-api]

    - title: ✨ 새 기능
      labels: [feature, enhancement]

    - title: 🐛 버그 수정
      labels: [bug, fix]

    - title: 📦 의존성
      labels: [dependencies]

    - title: 📝 문서
      labels: [documentation, docs]

    - title: 🧹 내부 정리
      labels: [refactor, chore, test, ci]

    - title: 기타
      labels: ["*"]
