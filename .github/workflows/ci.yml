name: CI

# 도는 시점은 세 가지입니다.
#   1. develop · main 으로 가는 PR (열 때 · 커밋 추가할 때 · 다시 열 때)
#   2. develop · main 에 머지·직접 푸시될 때
#   3. 수동 실행
# 작업 PR 은 develop 으로, 릴리스 PR(develop → main)만 main 으로 갑니다. 두 브랜치
# 모두의 PR 을 여기서 검증해야 어느 쪽 ruleset 이 요구하는 `ci-ok` 도 나옵니다.
# 태그는 여기서 안 잡습니다 — 릴리스는 release.yml 이 담당합니다.
#
# 문서만 고쳐도 돌게 두는 것은 의도적입니다. paths-ignore 로 건너뛰면 필수 체크인
# `ci-ok` 가 아예 생성되지 않아 PR 이 영원히 머지 대기 상태가 됩니다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR 에 새 커밋이 오면 이전 실행을 취소합니다. 다만 develop · main 푸시는 취소하지
  # 않습니다 — 연속 머지 때 중간 커밋이 한 번도 검증되지 않은 채 넘어가면 안 됩니다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # uv 가 파이썬을 직접 받게 두면 setup-python 보다 빠르고 3.15 도 바로 씁니다.
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  lint:
    name: 린트 · 타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --all-extras --frozen

      - name: ruff format (검사만)
        run: uv run ruff format --check --diff

      - name: ruff check
        run: uv run ruff check --output-format=github

      - name: ty check
        run: uv run ty check

      - name: 워크플로 린트 (actionlint)
        # "워크플로를 고쳤으면 actionlint 를 돌려라"(AGENTS.md §6)는 사람에게만
        # 통하는 규칙입니다. Dependabot 은 그 문장을 읽지 않고 두 워크플로의 액션
        # 버전을 계속 바꿉니다. 특히 release.yml 은 `v*` 태그에서만 돌아서 CI 가
        # 실행으로는 절대 못 잡습니다 — 릴리스 당일에야 드러나고, 그때는 되돌리기
        # 어렵습니다. 그래서 구문·스키마만이라도 여기서 강제합니다.
        # 러너에 shellcheck 가 깔려 있어 `run:` 블록까지 함께 검사됩니다.
        run: uv run actionlint .github/workflows/*.yml

  test:
    name: 테스트 (${{ matrix.python }})
    runs-on: ubuntu-latest
    # 우분투만 돕니다. 예전에는 Windows·macOS 러너를 하나씩 뒀는데, 근거였던
    # "curl_cffi 가 Windows 에서 DLL 로드에 실패해 requests 폴백을 탄다" 가
    # 러너에서는 사실이 아니었습니다 — curl-cffi 가 정상 설치되어 폴백 경로는
    # 한 번도 실행되지 않았습니다. `src/` 에 플랫폼 분기 코드도 없습니다.
    #
    # Windows 가 실제로 잡아주던 유일한 것은 기본 인코딩(cp1252 · cp949)이었고,
    # 그건 tests/test_style.py 의 `test_text_io_declares_encoding` 이 AST 로
    # 대신합니다 — 모든 플랫폼에서, 푸시 전에, 더 빠르게.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - name: 의존성 설치
        run: uv sync --all-extras

      - name: 테스트 + 커버리지
        # 커버리지 하한(90%)은 pyproject 의 addopts 에 있어 여기서 다시 지정하지 않습니다.
        run: uv run pytest --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: 커버리지 요약
        if: always()
        run: |
          {
            echo "### 커버리지 — Python ${{ matrix.python }}"
            echo ''
            uv run coverage report --format=markdown || echo '(커버리지 리포트 없음)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
          retention-days: 14

  lowest:
    name: 하한 의존성 (3.11)
    runs-on: ubuntu-latest
    # `pyproject.toml` 의 `>=` 하한을 실제로 검증하는 유일한 잡입니다. 나머지 잡은
    # uv.lock 의 최신 버전으로만 돌아서, **선언한 하한이 깨져 있어도 초록**입니다.
    # 실제로 curl-cffi 를 `>=0.7.0` 으로 선언해 두고도 0.7.0 에는 최상위
    # `curl_cffi.Session` 이 없어 `Korail()` 이 즉시 죽는 걸 놓쳤습니다 — CI 는 늘
    # 0.16.x 로 돌았고 Dependabot 은 하한을 건드리지 않기 때문입니다.
    # 3.11 한 곳만 보는 이유: 문제는 파이썬 버전이 아니라 의존성 하한이므로, 가장
    # 오래된 지원 버전에서 한 번만 확인하면 충분합니다.
    #
    # 이 환경변수 하나가 잡 전체의 해석 모드를 고정합니다. `uv sync --resolution
    # lowest-direct` 뒤에 그냥 `uv run pytest` 를 돌리면, `uv run` 이 기본 해석
    # (highest)으로 되돌리면서 최신 버전을 다시 깔아 **하한 테스트가 조용히 최신
    # 버전 테스트가 됩니다** — 처음 이 잡을 그렇게 썼다가 0.7.0 하한에서도
    # 초록으로 지나가는 걸 확인했습니다. 단계마다 `--no-sync` 를 붙이는 방법도
    # 있지만, 앞으로 단계를 추가할 때마다 같은 함정에 빠집니다.
    #
    # 부수 효과로 dev 의존성(pytest==8.0.0 · pytest-cov==5.0.0 등)도 하한으로
    # 깔립니다. 새 pytest 기능을 쓰는 테스트가 들어오면 이 잡이 먼저 빨개지는데,
    # 그건 dev 하한도 정직하게 지킨다는 뜻이라 의도한 동작입니다.
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다 (test_packaging 이 요구).
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # test (3.11) 과 Python·uv.lock 해시가 같아 캐시 키가 겹칩니다. 두 잡의
          # 해석 결과(lowest vs highest)가 다르므로 캐시를 분리합니다.
          cache-suffix: lowest
          python-version: "3.11"

      - name: 하한 버전으로 설치
        # `--frozen` 을 붙이지 않습니다 — lowest-direct 는 러너 안에서 uv.lock 을
        # 다시 써야 하기 때문입니다 (커밋되지 않으므로 저장소에는 영향이 없습니다).
        run: uv sync --all-extras

      - name: 테스트 + 커버리지
        # 커버리지 하한(90%)은 pyproject 의 addopts 에 있어 여기서 다시 지정하지 않습니다.
        # 해석 모드는 잡 env 의 UV_RESOLUTION 이 잡아 줍니다.
        run: uv run pytest

  build:
    name: 빌드 · 설치 확인
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: sdist · wheel 빌드
        run: uv build

      - name: 아티팩트 메타데이터 검증
        run: uvx twine check dist/*

      - name: 깨끗한 환경에서 휠 임포트
        # 소스 트리가 아닌 곳에서 돌려 실수로 src/ 를 임포트하지 않게 합니다.
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -c "
          import pykorail
          from pykorail import Card, Korail
          from pykorail.device import DEVICE_PROFILES
          assert pykorail.__version__
          assert len(DEVICE_PROFILES) == 100
          print('휠 정상:', pykorail.__version__)
          "

      - name: 빌드 아티팩트 업로드
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  security:
    name: 보안 스캔 (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 잠긴 의존성을 requirements.txt 로 내보내기
        # Trivy 가 uv.lock 을 못 읽는 버전이어도 의존성 취약점을 놓치지 않도록
        # 표준 포맷으로도 함께 내보냅니다.
        run: uv export --format requirements-txt --all-extras --no-emit-project -o requirements.txt

      - name: Trivy 스캔 (게이트)
        # HIGH·CRITICAL 이 하나라도 있으면 여기서 실패합니다.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
        env:
          # 콤마로 나열한 순서대로 시도합니다 (Trivy 의 db-repository 는 단일 값이
          # 아니라 "OCI repository(ies) ... in order of priority" 입니다). 한 곳을
          # 지정하면 그 한 곳이 죽었을 때 스캔 자체가 FATAL 로 끝나고, 필수 체크인
          # `ci-ok` 가 딸려 실패해 **열려 있는 모든 PR 이 빨개집니다.** 실제로
          # public.ecr.aws 가 TOOMANYREQUESTS 를 내면서 그 일이 있었습니다.
          # 뒤의 두 개는 Trivy 가 원래 쓰는 기본값이라, 우리가 새 공급원을
          # 고르는 게 아니라 껐던 폴백을 되살리는 것입니다.
          TRIVY_DB_REPOSITORY: >-
            public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: >-
            public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

      - name: Trivy 스캔 (SARIF 생성)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
        env:
          # 콤마로 나열한 순서대로 시도합니다 (Trivy 의 db-repository 는 단일 값이
          # 아니라 "OCI repository(ies) ... in order of priority" 입니다). 한 곳을
          # 지정하면 그 한 곳이 죽었을 때 스캔 자체가 FATAL 로 끝나고, 필수 체크인
          # `ci-ok` 가 딸려 실패해 **열려 있는 모든 PR 이 빨개집니다.** 실제로
          # public.ecr.aws 가 TOOMANYREQUESTS 를 내면서 그 일이 있었습니다.
          # 뒤의 두 개는 Trivy 가 원래 쓰는 기본값이라, 우리가 새 공급원을
          # 고르는 게 아니라 껐던 폴백을 되살리는 것입니다.
          TRIVY_DB_REPOSITORY: >-
            public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: >-
            public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

      - name: SARIF 를 코드 스캐닝에 업로드
        # 비공개 저장소에서 GitHub Advanced Security 가 없으면 이 단계는 실패합니다.
        # 위의 게이트가 이미 빌드를 막으므로 업로드 실패로 CI 를 깨뜨리지 않습니다.
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # main 으로 가는 PR 은 develop 에서만 와야 합니다. 기본 브랜치가 main 이라 GitHub UI·
  # gh 로 PR 을 열면 작업 PR 이 main 으로 가기 쉽습니다. 여기서 막습니다.
  # develop 으로 가는 PR 에서는 건너뜁니다 — ci-ok 의 always() 집계는 skipped 를 실패로
  # 보지 않으므로 문제없습니다.
  release-source:
    name: 릴리스 PR 출처 확인
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: 이 저장소의 develop 에서 온 PR 인지 확인
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # head_ref 는 브랜치 이름만 담습니다 — 포크에서 develop 이라는 이름의 브랜치로
          # main 에 PR 을 열면 이름만으로는 통과합니다. 저장소까지 확인해야 합니다.
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::main 으로 가는 PR 은 이 저장소($THIS_REPO)의 develop 에서만 열 수 있습니다 (fork=$HEAD_REPO, head=$HEAD_REF)."
            exit 1
          fi

          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main 으로 가는 PR 은 develop 에서만 열 수 있습니다 (head=$HEAD_REF)."
            exit 1
          fi

  # 브랜치 보호(ruleset)에서 필수로 지정하는 유일한 체크입니다.
  # 이름은 상태 체크 컨텍스트로 쓰이므로 ASCII 로 고정합니다 — 바꾸면
  # .github/rulesets/develop-protection.json · main-protection.json 도 함께 고쳐야 합니다.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [lint, test, lowest, build, security, release-source]
    if: always()
    steps:
      - name: 선행 잡 결과 확인
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
