name: site

# site/ 아래의 랜딩 페이지 · 문서 사이트(Astro Starlight)입니다. 페이지는 거기서 쓰지 않습니다 —
# site/scripts/sync-docs.mjs 가 빌드 시점에 README.md · docs/reference.md · CONTRIBUTING.md
# 에서 만들어 내므로 사이트가 저장소와 어긋날 수 없습니다.
#
# 그 원본이나 site/ 를 건드린 PR · develop · main 푸시에서 사이트를 빌드하고 내부
# 링크를 검사합니다.
# 깨진 페이지가 배포 뒤가 아니라 여기서 드러나게 하려는 것입니다. **배포는 여기서 하지
# 않습니다** — Cloudflare Workers Builds 가 자체 Git 연동으로 빌드 · 배포하므로(docs/site.md)
# Cloudflare API 토큰이 이 저장소에 들어오지 않습니다. 릴리스 뒤 재빌드를 부르는 훅 URL 은
# release.yml 의 시크릿으로만 있습니다.
#
# 경로 필터가 있어서 필수 체크가 될 수 없습니다. 필터에 안 걸린 PR 에서는 체크가 아예
# 생성되지 않아 영원히 머지 대기가 되기 때문입니다 (ci.yml 이 paths-ignore 를 안 쓰는 이유와
# 같습니다). 필수 체크는 계속 `ci-ok` 하나입니다.
#
# 아래 경로 목록은 sync-docs.mjs 의 PAGES 와 맞춰야 합니다 — 페이지를 추가하면 여기도 추가하세요.
# Cloudflare 의 Build watch paths 도 같은 목록이어야 합니다 (docs/site.md, 이 워크플로 파일은 빌드 입력이 아니라 빠집니다).
on:
  pull_request:
    branches: [main, develop]
    paths: &site_paths
      - "site/**"
      - "README.md"
      - "docs/reference.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/site.yml"
  push:
    branches: [main, develop]
    paths: *site_paths
  workflow_dispatch:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: 사이트 빌드 · 링크 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # 사이트는 패키지를 임포트하지 않아 hatch-vcs 태그가 필요 없습니다. 얕은 체크아웃으로 충분합니다.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 의존성 설치
        # `npm ci` 는 lockfile 그대로만 설치합니다.
        run: npm ci

      - name: 의존성 취약점 검사
        run: npm audit --omit=dev --audit-level=moderate

      - name: Astro 진단 (astro check)
        # 빌드는 타입 오류가 있어도 통과합니다. 컴포넌트 · stats.ts 의 타입 오류는 여기서만 잡힙니다.
        run: npm run check

      - name: 빌드 + 내부 링크 검사
        # package.json 의 "build" 가 sync-docs → astro build → check-links 를 차례로 돌립니다.
        run: npm run build
