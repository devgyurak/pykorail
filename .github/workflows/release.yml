name: Release

# v0.1.0 처럼 태그를 밀면 실행됩니다.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# PyPI 업로드는 API 토큰이 아니라 **Trusted Publishing(OIDC)** 을 씁니다.
# 최초 1회 PyPI 에서 설정해야 합니다:
#   PyPI → pykorail → Publishing → Add a new pending publisher
#     Owner: devgyurak / Repository: pykorail
#     Workflow: release.yml / Environment: pypi
# 설정 전에는 publish 잡이 실패합니다 (그 앞 단계는 정상 동작).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: PyPI 업로드 없이 빌드·검증만
        type: boolean
        default: true

# 릴리스는 절대 취소하지 않습니다. 업로드 도중 끊기면 PyPI 에 반쪽짜리 상태가
# 남을 수 있고, 그건 되돌릴 수 없습니다 (같은 버전 재업로드 불가).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 태그에서 버전 도출
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 태그가 main 이력인지 확인
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # 평소 작업 위치가 develop 이라 거기서 태그를 미는 실수가 현실적입니다.
          # 태그 보호(tag-protection)는 "생성 권한"만 보고 커밋 위치는 안 봅니다.
          # main 에서 (또는 릴리스 PR 에서) 민 태그만 PyPI 로 가도록 여기서 막습니다.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::태그 ${GITHUB_REF_NAME} 이 main 의 이력이 아닙니다. main 에서 태그를 미세요."
            exit 1
          fi

      - name: 태그에서 버전 도출
        id: version
        run: |
          set -euo pipefail

          # 버전의 유일한 출처는 git 태그입니다 (hatch-vcs). pyproject.toml 에는
          # 숫자가 없고 빌드 시점에 태그에서 채워지므로, 손으로 올릴 것이 없습니다.
          uv sync --all-extras --frozen
          pkg_version="$(uv run python -c 'import pykorail; print(pykorail.__version__)')"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "태그: ${GITHUB_REF_NAME} → 버전 ${tag_version}"

            # 여기서 어긋나면 태그가 아니라 hatch-vcs 설정 문제입니다
            # (얕은 체크아웃으로 태그가 안 보이는 경우 등).
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::태그(${tag_version})에서 도출된 버전이 패키지 버전(${pkg_version})과 다릅니다. \
          checkout 의 fetch-depth 와 hatch-vcs 설정을 확인하세요."
              exit 1
            fi
          fi

          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          # PEP 440 사전 릴리스(0.2.0b1 등)는 GitHub 릴리스도 prerelease 로 표시합니다.
          if printf '%s' "$pkg_version" | grep -Eq '(a|b|rc|\.dev)[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: 게이트 (${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [verify]
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - name: 의존성 설치
        run: uv sync --all-extras

      - name: 린트 · 타입 · 테스트
        # 릴리스는 되돌리기 어려우므로 전체 게이트를 지원 버전 전부에서 다시 돌립니다.
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run ty check
          uv run pytest

  security:
    name: 보안 스캔 (Trivy)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 잠긴 의존성 내보내기
        run: uv export --format requirements-txt --all-extras --no-emit-project -o requirements.txt

      - name: Trivy 스캔
        # 취약한 의존성을 그대로 PyPI 에 올리지 않도록 릴리스에서도 게이트합니다.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
        env:
          # 콤마로 나열한 순서대로 시도합니다 (Trivy 의 db-repository 는 단일 값이
          # 아니라 "OCI repository(ies) ... in order of priority" 입니다). 한 곳을
          # 지정하면 그 한 곳이 죽었을 때 스캔 자체가 FATAL 로 끝나고, `build` 가
          # `security` 를 needs 로 걸고 있어 **릴리스가 통째로 멈춥니다.** 태그는
          # 이미 밀린 뒤라 수습이 가장 성가신 시점입니다. 실제로 public.ecr.aws 가
          # TOOMANYREQUESTS 를 내서 CI 쪽에서 그 일이 있었습니다.
          # 뒤의 두 개는 Trivy 가 원래 쓰는 기본값이라, 우리가 새 공급원을
          # 고르는 게 아니라 껐던 폴백을 되살리는 것입니다.
          TRIVY_DB_REPOSITORY: >-
            public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: >-
            public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

  build:
    name: 배포 아티팩트 빌드
    runs-on: ubuntu-latest
    needs: [verify, gate, security]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs 가 태그를 읽어야 버전이 나옵니다.
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 빌드
        run: uv build

      - name: 메타데이터 검증
        run: uvx twine check dist/*

      - name: 휠 설치 확인
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -c "import pykorail; print('휠 정상:', pykorail.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: PyPI 업로드
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: github.event_name == 'push' || inputs.dry_run == false
    environment:
      name: pypi
      url: https://pypi.org/p/pykorail
    permissions:
      # Trusted Publishing 용 OIDC 토큰. API 토큰을 저장하지 않습니다.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: PyPI 에 업로드
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 같은 버전을 다시 밀었을 때 워크플로 전체를 깨뜨리지 않습니다.
          skip-existing: true
          print-hash: true

  github-release:
    name: GitHub 릴리스 생성
    runs-on: ubuntu-latest
    needs: [verify, build, publish]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: 릴리스 노트 작성 + 발행
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail

          # 헤더는 직접 쓰고, 변경 목록은 GitHub 이 PR·커밋에서 생성하게 합니다
          # (.github/release.yml 의 라벨 분류를 따릅니다).
          cat > notes.md <<EOF
          ## pykorail v${VERSION}

          \`\`\`bash
          uv add pykorail==${VERSION}
          # 또는
          pip install pykorail==${VERSION}
          \`\`\`

          - PyPI: https://pypi.org/project/pykorail/${VERSION}/
          - 지원 파이썬: 3.11 – 3.15
          EOF

          # `--generate-notes` 가 위 내용 뒤에 PR·커밋 기반 변경 목록을 붙입니다
          # (분류는 .github/release.yml 을 따릅니다).
          flags=(--title "v${VERSION}" --notes-file notes.md --generate-notes --verify-tag)

          # `set -e` 아래에서 `[ ... ] && arr+=(...)` 는 조건이 거짓일 때 종료 상태 1 을
          # 남기므로, 애매함을 없애려고 명시적으로 분기합니다.
          if [ "${PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" dist/*

  site:
    name: 문서 사이트 재빌드
    runs-on: ubuntu-latest
    # 사이트의 버전 표시는 빌드 때 PyPI 에서 읽습니다 (site/src/lib/stats.ts). 태그는 Cloudflare
    # 빌드를 일으키지 않으므로, 업로드가 끝난 뒤 배포 훅으로 main 을 다시 빌드시킵니다 (docs/site.md).
    # 사전 릴리스는 PyPI 의 대표 버전이 되지 않으니 반영할 값이 없어 건너뜁니다.
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    timeout-minutes: 40
    # 체크아웃도 토큰도 필요 없습니다. 이 잡은 훅 URL 을 부르고 페이지에 버전이 보이는지 확인합니다.
    permissions: {}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - name: 배포 훅 시크릿 확인
        run: |
          # 비어 있을 때 조용히 건너뛰면 사이트가 아무도 모르게 옛 버전으로 남습니다.
          if [ -z "$HOOK" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK 시크릿이 없습니다. docs/site.md 의 배포 훅 절차를 따르세요."
            exit 1
          fi

      - name: PyPI 에 새 버전이 보일 때까지 대기
        run: |
          set -euo pipefail
          # 대표 엔드포인트(/pypi/pykorail/json) 대신 버전별 엔드포인트를 봅니다. 업로드가 끝나면
          # 이 엔드포인트가 200 을 줍니다. 아직 없는 동안의 404 는 로그에 남기지 않습니다.
          for _ in $(seq 1 40); do
            if curl -fs --max-time 10 -o /dev/null "https://pypi.org/pypi/pykorail/${VERSION}/json"; then
              echo "PyPI 에서 ${VERSION} 을 확인했습니다."
              exit 0
            fi
            sleep 15
          done
          echo "::error::10분이 지나도 PyPI 에 ${VERSION} 이 보이지 않습니다."
          exit 1

      - name: 옛 캐시가 비워질 때까지 대기
        run: |
          # PyPI 는 업로드가 끝나면 Fastly 캐시를 soft purge 합니다. 옛 대표 응답은 대개 몇 분 안에
          # 사라집니다. 남는 경우는 아래 사이트 확인 단계가 잡습니다. 이 대기는 빌드가 옛 값을 읽을
          # 가능성을 줄이려는 여유입니다.
          sleep 360

      - name: Cloudflare 에 main 재빌드 요청
        run: |
          set -euo pipefail
          # 훅 URL 은 로그에 찍지 않습니다. 훅은 main 빌드 하나만 일으키고 배포 내용은 바꾸지 못합니다.
          curl -fsS -X POST -o /dev/null "$HOOK"
          echo "v${VERSION} 사이트 재빌드를 요청했습니다."

      - name: 사이트에 새 버전이 나타날 때까지 확인
        run: |
          set -euo pipefail
          # 훅 응답이 2xx 라도 빌드가 옛 값을 읽었거나 캐시 비우기가 실패할 수 있습니다. 그래서
          # 실제 페이지에 버전이 보이는지 봅니다. 페이지의 VERSION 은 `>0.5.1</a>` 로 나옵니다.
          # grep -q 를 파이프로 쓰면 pipefail 아래에서 curl 의 SIGPIPE 가 실패로 잡히므로 변수에 받습니다.
          for _ in $(seq 1 30); do
            page="$(curl -fs --max-time 20 https://pykorail.devgyurak.com/ || true)"
            if [[ "$page" == *">${VERSION}</a>"* ]]; then
              echo "사이트에 ${VERSION} 이 나타났습니다."
              exit 0
            fi
            sleep 30
          done
          echo "::error::15분이 지나도 사이트에 ${VERSION} 이 보이지 않습니다. Cloudflare 빌드 로그와 PyPI 캐시를 확인하세요."
          exit 1
