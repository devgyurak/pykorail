# 의존성 범프 자동화. 여기서 오는 PR 도 `ci-ok` 를 통과해야 머지됩니다.
#
# 켠 이유는 편의가 아니라 **게이트** 입니다. `ci.yml` 의 Trivy 잡이 HIGH·CRITICAL
# 에서 `exit-code: 1` 이고 `ci-ok` 가 필수 체크이므로, 잠긴 의존성에 CVE 가 하나
# 뜨면 그 순간부터 **열려 있는 모든 PR 이 빨개집니다.** 먼저 범프 PR 이 올라와
# 있으면 관계없는 작업이 막히지 않습니다.
#
# 주기가 daily 가 아니라 weekly 인 것은 의도입니다 — 범프 PR 이 모이는 develop 은
# 승인 1개 + CODEOWNERS 리뷰 + 최신 상태(strict)를 요구해서
# (`.github/rulesets/develop-protection.json`) 범프 PR 도 사람이 하나씩 승인하고
# 리베이스해야 합니다. daily 면 관리 비용이 이득을 넘습니다.
#
# 작업 PR 의 도착지는 develop 이고 main 은 릴리스 전용입니다. 그래서 세 생태계 모두
# `target-branch: develop` 을 지정합니다 — 기본 브랜치인 main 으로 열면 흐름을 벗어납니다.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # 액션은 대부분 major 태그로 핀돼 있어(`actions/checkout@v5`) major 때만 PR 이
    # 옵니다. 하나로 묶어도 시끄럽지 않습니다. 예외는 정확히 핀된
    # `aquasecurity/trivy-action@v0.36.0` — 패치 PR 이 오는데, Trivy 는 자주
    # 고쳐지는 스캐너라 그건 오는 쪽이 맞습니다.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # 저장소 규약의 `UPT:` 접두사를 그대로 씁니다 (AGENTS.md 7절).
      # `include: scope` 는 쓰지 않습니다 — `UPT(deps): …` 가 되어 규약과 어긋납니다.
      prefix: "UPT:"
    labels: [dependencies, ci]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # 이 패키지는 라이브러리입니다. 런타임 의존성의 하한(`certifi>=2024.2.2`)이
    # 범프마다 따라 올라가면 사용자 환경을 근거 없이 좁힙니다. 그래서
    # increase-if-necessary — 필요할 때만 pyproject 를 고치고, 평소에는 uv.lock
    # 만 갱신합니다.
    versioning-strategy: increase-if-necessary
    # 그룹을 `dependency-type: development`/`production` 으로 나누고 싶지만
    # **그 옵션은 uv 생태계에서 지원되지 않습니다** — groups 의 dependency-type 은
    # bundler·composer·mix·maven·npm·pip 에만 붙습니다(allow 쪽은 uv 도 되는 것과
    # 다릅니다). 지정해도 오류가 아니라 **조용히 무시**되고 그룹이 안 잡히므로
    # 이름 패턴으로 나눕니다. 이 저장소가 가장 싫어하는 실패 형태라 남겨 둡니다.
    groups:
      # ruff·ty 범프는 CI 를 깨뜨릴 수 있습니다 (새 포맷 규칙 · 새 타입 진단).
      # 한 PR 로 묶어 두면 그 수정을 한 번에 합니다. `ty` 는 아직 0.x 베타라
      # 진단이 늘어나는 것이 정상입니다 — 게이트를 낮추지 말고 코드를 고치세요.
      # 목록은 pyproject 의 [dependency-groups] dev 와 맞춰야 합니다.
      dev-tools:
        patterns: [ruff, ty, "pytest*", "actionlint*"]
      # 나머지 전부. `patterns: ["*"]` 로 받아 두는 것이 핵심입니다 — 여기에
      # 이름을 나열하면 나중에 추가한 의존성이 어느 그룹에도 안 들어가
      # 혼자 PR 을 열고, 그걸 알아채는 사람이 없습니다.
      runtime:
        patterns: ["*"]
        exclude-patterns: [ruff, ty, "pytest*", "actionlint*"]
    commit-message:
      prefix: "UPT:"
    labels: [dependencies]

  # 문서 사이트(site/)의 Node 의존성. 패키지와는 무관하지만 `ci.yml` 의 Trivy 가
  # 저장소 전체를 스캔하므로 `site/package-lock.json` 의 CVE 도 `ci-ok` 를 막습니다 —
  # 위의 uv 생태계와 같은 이유로, 범프 PR 이 먼저 와 있어야 무관한 작업이 안 막힙니다.
  - package-ecosystem: npm
    directory: /site
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # 하나로 묶습니다. astro 와 @astrojs/starlight 는 서로 맞는 버전끼리만 빌드되어
    # 따로 올라오면 둘 다 빨개집니다. `site.yml` 이 이 PR 에서 빌드 · 링크 검사를 돌립니다.
    groups:
      site:
        patterns: ["*"]
    ignore:
      # typescript 메이저는 **지금은** 받지 않습니다 — 거부가 아니라 보류입니다.
      # `@astrojs/check` 의 peer 가 `typescript ^5 || ^6` 이라 7 을 넣으면 `npm ci` 가
      # ERESOLVE 로 죽습니다(#35). `--legacy-peer-deps` 로 우회하지 마세요 — 지원 안
      # 되는 조합으로 `astro check` 를 돌리게 됩니다.
      #
      # 받을 수 있게 되면 올립니다: `npm view @astrojs/check peerDependencies` 에 새
      # 메이저가 들어오면 이 항목을 지우세요. 그러면 다음 Dependabot 실행이 범프 PR 을
      # 다시 엽니다. 마이너 · 패치는 지금도 계속 받습니다.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "UPT:"
    labels: [dependencies]
