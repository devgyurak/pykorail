# 의존성 범프 자동화. 여기서 오는 PR 도 `ci-ok` 를 통과해야 머지됩니다.
#
# 켠 이유는 편의가 아니라 **게이트** 입니다. `ci.yml` 의 Trivy 잡이 HIGH·CRITICAL
# 에서 `exit-code: 1` 이고 `ci-ok` 가 필수 체크이므로, 잠긴 의존성에 CVE 가 하나
# 뜨면 그 순간부터 **열려 있는 모든 PR 이 빨개집니다.** 먼저 범프 PR 이 올라와
# 있으면 관계없는 작업이 막히지 않습니다.
#
# 주기가 daily 가 아니라 weekly 인 것은 의도입니다 — main 은 승인 1개 + CODEOWNERS
# 리뷰 + 최신 상태(strict)를 요구해서(`.github/rulesets/main-protection.json`)
# 범프 PR 도 사람이 하나씩 승인하고 리베이스해야 합니다. daily 면 관리 비용이
# 이득을 넘습니다.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # 액션은 대부분 major 태그로 핀돼 있어(`actions/checkout@v5`) major 때만 PR 이
    # 옵니다. 하나로 묶어도 시끄럽지 않습니다. 예외는 정확히 핀된
    # `aquasecurity/trivy-action@v0.36.0` — 패치 PR 이 오는데, Trivy 는 자주
    # 고쳐지는 스캐너라 그건 오는 쪽이 맞습니다.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # 저장소 규약의 `UPT:` 접두사를 그대로 씁니다 (AGENTS.md 7절).
      # `include: scope` 는 쓰지 않습니다 — `UPT(deps): …` 가 되어 규약과 어긋납니다.
      prefix: "UPT:"
    labels: [dependencies, ci]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # 이 패키지는 라이브러리입니다. 런타임 의존성의 하한(`certifi>=2024.2.2`)이
    # 범프마다 따라 올라가면 사용자 환경을 근거 없이 좁힙니다. 그래서
    # increase-if-necessary — 필요할 때만 pyproject 를 고치고, 평소에는 uv.lock
    # 만 갱신합니다.
    versioning-strategy: increase-if-necessary
    # 그룹을 `dependency-type: development`/`production` 으로 나누고 싶지만
    # **그 옵션은 uv 생태계에서 지원되지 않습니다** — groups 의 dependency-type 은
    # bundler·composer·mix·maven·npm·pip 에만 붙습니다(allow 쪽은 uv 도 되는 것과
    # 다릅니다). 지정해도 오류가 아니라 **조용히 무시**되고 그룹이 안 잡히므로
    # 이름 패턴으로 나눕니다. 이 저장소가 가장 싫어하는 실패 형태라 남겨 둡니다.
    groups:
      # ruff·ty 범프는 CI 를 깨뜨릴 수 있습니다 (새 포맷 규칙 · 새 타입 진단).
      # 한 PR 로 묶어 두면 그 수정을 한 번에 합니다. `ty` 는 아직 0.x 베타라
      # 진단이 늘어나는 것이 정상입니다 — 게이트를 낮추지 말고 코드를 고치세요.
      # 목록은 pyproject 의 [dependency-groups] dev 와 맞춰야 합니다.
      dev-tools:
        patterns: [ruff, ty, "pytest*"]
      # 나머지 전부. `patterns: ["*"]` 로 받아 두는 것이 핵심입니다 — 여기에
      # 이름을 나열하면 나중에 추가한 의존성이 어느 그룹에도 안 들어가
      # 혼자 PR 을 열고, 그걸 알아채는 사람이 없습니다.
      runtime:
        patterns: ["*"]
        exclude-patterns: [ruff, ty, "pytest*"]
    commit-message:
      prefix: "UPT:"
    labels: [dependencies]
